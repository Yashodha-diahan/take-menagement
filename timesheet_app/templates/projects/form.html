{% extends "base.html" %}

{% block title %}{{ "Edit Project" if project else "New Project" }}{% endblock %}

{% block content %}
<h1>{{ "Edit Project" if project else "New Project" }}</h1>

<form method="post">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required
               value="{{ project.name if project else '' }}">
    </div>

    <div class="form-group">
        <label for="client">Client</label>
        <input type="text" id="client" name="client"
               value="{{ project.client if project else '' }}">
    </div>

    <div class="form-group">
        <label for="start_date">Start date</label>
        <input type="date" id="start_date" name="start_date"
               value="{{ project.start_date if project else '' }}">
    </div>

    <div class="form-group">
        <label for="end_date">End date</label>
        <input type="date" id="end_date" name="end_date"
               value="{{ project.end_date if project else '' }}">
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status">
            <option value="active" {% if project and project.status == "active" %}selected{% endif %}>Active</option>
            <option value="archived" {% if project and project.status == "archived" %}selected{% endif %}>Archived</option>
        </select>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4">{{ project.description if project else '' }}</textarea>
    </div>

    <button type="submit" class="btn">Save</button>
    <a class="btn btn-danger" href="{{ url_for('projects.list_projects') }}">Cancel</a>
</form>
{% endblock %}
