{% extends "base.html" %}

{% block title %}{{ "Edit Time Sheet Entry" if timesheet else "New Time Sheet Entry" }}{% endblock %}

{% block content %}
<h1>{{ "Edit Time Sheet Entry" if timesheet else "New Time Sheet Entry" }}</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post">
    <div class="form-group">
        <label>Status</label>
        <input type="hidden" id="status" name="status" value="{{ timesheet.status if timesheet else 'draft' }}">
        <div class="status-picker">
            <div class="status-group" id="stage-group">
                <button type="button" class="status-btn status-draft-btn" data-value="draft">Draft</button>
                <button type="button" class="status-btn status-submitted-btn" data-value="submitted">Submitted</button>
            </div>
            <div class="status-group" id="decision-group">
                <button type="button" class="status-btn status-approved-btn" data-value="approved">Approved</button>
                <button type="button" class="status-btn status-rejected-btn" data-value="rejected">Rejected</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="employee_id">Employee</label>
        <select id="employee_id" name="employee_id" required>
            <option value="">-- Select an employee --</option>
            {% for e in employees %}
            <option value="{{ e.id }}" {% if timesheet and timesheet.employee_id|string == e.id|string %}selected{% endif %}>
                {{ e.full_name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="project_id">Project</label>
        <select id="project_id" name="project_id" required>
            <option value="">-- Select a project --</option>
            {% for p in projects %}
            <option value="{{ p.id }}" {% if timesheet and timesheet.project_id|string == p.id|string %}selected{% endif %}>
                {{ p.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="task_id">Task</label>
        <select id="task_id" name="task_id" required>
            <option value="">-- Select a project first --</option>
            {% for t in tasks %}
            <option value="{{ t.id }}" {% if timesheet and timesheet.task_id|string == t.id|string %}selected{% endif %}>
                {{ t.title }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="work_date">Work date</label>
        <input type="date" id="work_date" name="work_date" required
               value="{{ timesheet.work_date if timesheet else '' }}">
    </div>

    <div class="form-group">
        <label for="hours_worked">Hours worked</label>
        <input type="number" id="hours_worked" name="hours_worked" step="0.25" min="0" required
               value="{{ timesheet.hours_worked if timesheet else '' }}">
    </div>

    <div class="form-group">
        <label for="notes">Description / notes</label>
        <textarea id="notes" name="notes" rows="3">{{ timesheet.notes if timesheet else '' }}</textarea>
    </div>

    <button type="submit" class="btn">Save</button>
    <a class="btn btn-danger" href="{{ url_for('timesheets.list_timesheets') }}">Cancel</a>
</form>

<script>
    const projectSelect = document.getElementById("project_id");
    const taskSelect = document.getElementById("task_id");
    const currentTaskId = "{{ timesheet.task_id if timesheet else '' }}";

    function loadTasks(projectId, selectedTaskId) {
        taskSelect.innerHTML = '<option value="">-- Select a project first --</option>';
        if (!projectId) {
            return;
        }
        fetch(`/timesheets/tasks-by-project/${projectId}`)
            .then((response) => response.json())
            .then((tasks) => {
                taskSelect.innerHTML = '<option value="">-- Select a task --</option>';
                tasks.forEach((task) => {
                    const option = document.createElement("option");
                    option.value = task.id;
                    option.textContent = task.title;
                    if (String(task.id) === String(selectedTaskId)) {
                        option.selected = true;
                    }
                    taskSelect.appendChild(option);
                });
            });
    }

    projectSelect.addEventListener("change", () => {
        loadTasks(projectSelect.value, "");
    });

    if (projectSelect.value) {
        loadTasks(projectSelect.value, currentTaskId);
    }

    // Status picker: Draft/Submitted on the left, Approved/Rejected on the right.
    // The Approved/Rejected group only shows once "Submitted" is active (or the
    // entry is already approved/rejected). Picking a button highlights it while
    // the other button in that group stays visible so it can still be chosen.
    const statusInput = document.getElementById("status");
    const stageButtons = document.querySelectorAll("#stage-group .status-btn");
    const decisionButtons = document.querySelectorAll("#decision-group .status-btn");
    const decisionGroup = document.getElementById("decision-group");
    const allStatusButtons = document.querySelectorAll(".status-btn");

    function highlight(value) {
        allStatusButtons.forEach((btn) => {
            btn.classList.toggle("selected", btn.dataset.value === value);
        });
    }

    function updateDecisionVisibility(value) {
        const showDecision = value === "submitted" || value === "approved" || value === "rejected";
        decisionGroup.style.display = showDecision ? "flex" : "none";
    }

    function setStatus(value) {
        statusInput.value = value;
        highlight(value);
        updateDecisionVisibility(value);
    }

    stageButtons.forEach((btn) => {
        btn.addEventListener("click", () => setStatus(btn.dataset.value));
    });

    decisionButtons.forEach((btn) => {
        btn.addEventListener("click", () => setStatus(btn.dataset.value));
    });

    setStatus(statusInput.value);
</script>
{% endblock %}
