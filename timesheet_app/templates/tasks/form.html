{% extends "base.html" %}

{% block title %}{{ "Edit Task" if task else "New Task" }}{% endblock %}

{% block content %}
<h1>{{ "Edit Task" if task else "New Task" }}</h1>

<form method="post">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required
               value="{{ task.title if task else '' }}">
    </div>

    <div class="form-group">
        <label for="project_id">Project</label>
        <select id="project_id" name="project_id" required>
            <option value="">-- Select a project --</option>
            {% for p in projects %}
            <option value="{{ p.id }}" {% if task and task.project_id == p.id %}selected{% endif %}>
                {{ p.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="employee_id">Assigned employee</label>
        <select id="employee_id" name="employee_id">
            <option value="">-- Unassigned --</option>
            {% for e in employees %}
            <option value="{{ e.id }}" {% if task and task.employee_id == e.id %}selected{% endif %}>
                {{ e.full_name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="estimated_hours">Estimated hours</label>
        <input type="number" id="estimated_hours" name="estimated_hours" step="0.5" min="0"
               value="{{ task.estimated_hours if task and task.estimated_hours is not none else '' }}">
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status">
            {% for s in ["open", "in_progress", "done", "cancelled"] %}
            <option value="{{ s }}" {% if task and task.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4">{{ task.notes if task else '' }}</textarea>
    </div>

    <button type="submit" class="btn">Save</button>
    <a class="btn btn-danger" href="{{ url_for('tasks.list_tasks') }}">Cancel</a>
</form>
{% endblock %}
